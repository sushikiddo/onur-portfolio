<!DOCTYPE html>
<html lang="tr"><head><script>try{document.documentElement.dataset.theme=localStorage.getItem('portfolio-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Sayfa bulunamadı | Onur Can Orhan</title><meta content="Aradığın sayfa bu evrende yok." name="description"/><meta name="robots" content="noindex"/><link href="/assets/css/style.css" rel="stylesheet"/><link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
<style>
body{overflow-x:clip}.lost{position:relative;isolation:isolate;min-height:100svh;display:grid;align-content:center;padding-block:120px}
.lost-orbit{position:absolute;z-index:-1;right:-8vw;top:50%;width:min(62vw,640px);aspect-ratio:1;translate:0 -50%;border-radius:50%;border:1px solid color-mix(in srgb,var(--teal) 40%,transparent);box-shadow:inset 0 0 120px color-mix(in srgb,var(--blue) 25%,transparent)}
.lost-orbit::before{content:"";position:absolute;inset:-8% -22%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);rotate:-14deg}
.lost-orbit::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--text);box-shadow:0 0 18px var(--accent);left:8%;top:70%}
.lost-code{margin:0;font:700 clamp(7rem,22vw,17rem)/.85 var(--font-display);letter-spacing:-.06em;color:var(--text)}
.lost h1{margin:18px 0 0;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.02}
.lost .lead{max-width:34rem;margin-top:22px;color:var(--muted)}
.lost .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.lost .actions .btn{margin-top:0}
.lost-en{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);max-width:34rem;color:var(--muted);font:400 .7rem/1.8 var(--font-mono);letter-spacing:.12em}
.lost-en a{color:var(--accent)}
@media(max-width:760px){.lost-orbit{opacity:.45;top:auto;bottom:-18%;translate:0;width:110vw}}
@media(prefers-reduced-motion:no-preference){.lost-orbit{animation:lost-spin 40s linear infinite}@keyframes lost-spin{to{rotate:360deg}}}
</style></head>
<body><main class="lost wrap" id="main">
