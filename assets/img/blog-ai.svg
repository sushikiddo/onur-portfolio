<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">AI-assisted coding study</title><desc id="desc">A code review workflow connecting a prompt, generated suggestion and human verification.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081326"/><stop offset="1" stop-color="#20284a"/></linearGradient></defs><rect width="1000" height="650" fill="url(#bg)"/><g font-family="Arial,sans-serif"><rect x="105" y="188" width="230" height="235" rx="10" fill="#0b162a" stroke="#6b7e9f" stroke-width="2"/><rect x="385" y="150" width="230" height="310" rx="10" fill="#0b162a" stroke="#5d83ff" stroke-width="2"/><rect x="665" y="188" width="230" height="235" rx="10" fill="#0b162a" stroke="#6bdecd" stroke-width="2"/><g fill="#f1f2ee"><text x="128" y="226" font-size="14" letter-spacing="2">PROMPT</text><text x="408" y="188" font-size="14" letter-spacing="2">SUGGESTION</text><text x="688" y="226" font-size="14" letter-spacing="2">REVIEW</text><text x="128" y="275" font-size="18">Define the task</text><text x="128" y="305" font-size="14" fill="#aebbd4">constraints + context</text><text x="408" y="240" font-size="14" fill="#6bdecd">function renderMenu() {</text><text x="428" y="277" font-size="14" fill="#aebbd4">// proposed code</text><text x="408" y="314" font-size="14" fill="#6bdecd">return accessible;</text><text x="408" y="351" font-size="14" fill="#aebbd4">}</text><text x="688" y="275" font-size="18">Check the result</text><text x="688" y="305" font-size="14" fill="#aebbd4">test · inspect · revise</text></g><path d="M342 306h32m-10-10 10 10-10 10M622 306h32m-10-10 10 10-10 10" fill="none" stroke="#5d83ff" stroke-width="3"/><text x="105" y="535" fill="#aebbd4" font-size="15" letter-spacing="4">ASSIST / VERIFY / LEARN</text></g></svg>
